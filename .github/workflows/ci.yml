name: Tests and macOS Preview build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          architecture: arm64
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip check
      - run: python -B -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
          HF_HUB_OFFLINE: '1'
  build:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: tests
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.11'
          architecture: arm64
      - run: python -m pip install -r requirements-lock.txt
      - run: python scripts/build_release.py
      - run: python scripts/verify_release.py
        env:
          QT_QPA_PLATFORM: offscreen
      - run: ditto -c -k --sequesterRsrc --keepParent dist/zoomtrans.app dist/zoomtrans-ci-macos26-arm64.zip
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: macos26-arm64-build-not-inference-verified
          path: |
            dist/zoomtrans-ci-macos26-arm64.zip
            output/release-check/
          retention-days: 7
